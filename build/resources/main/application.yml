      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  graphql:
    http:
      path: /api/v1/graphql
    graphiql:
      enabled: true
      path: /api/v1/graphiql
    cors:
      allowed-origins:
        - http://localhost:3000
        - http://localhost:4042
        - https://dev.andrey-evtukh.vercel.app
        - https://andrey-evtukh.vercel.app
      allowed-methods:
        - GET
        - POST
        - OPTIONS
      allowed-headers: "*"
      allow-credentials: true

server:
  port: 8082

resend:
  api-key: ${RESEND_API_KEY}
  from: ${MAIL_FROM:andrey.evtukh@gmail.com}

jwt:
  secret: ${JWT_SECRET:436a2692f8e7fb78240068bb110d87f5222a8486c7f98fd06884e71a2b3178c9}
  expiration-ms: 3600000   # 1 час

app:
  frontend-url: http://localhost:3000   # для ссылки сброса пароля
