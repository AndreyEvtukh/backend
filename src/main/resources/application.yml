spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  graphql:
    http:
      path: /api/v1/graphql
    graphiql:
      enabled: true
      path: /api/v1/graphiql

  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_SMTP_LOGIN}
    password: ${BREVO_SMTP_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
mail:
  from: andrey.evtukh@gmail.com

server:
  port: ${PORT:8082}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000

app:
  verification-code-ttl-minutes: 5